name: CI

# Two triggers, deliberately. Pull requests gate what merges; pushes to main
# catch anything that reached the branch another way, which on this repository
# is the normal path rather than the exception.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run tells you about code nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Where the service containers listen. The test suite supplies its own
  # obviously-fake secrets through an autouse fixture, so none are set here;
  # CI never holds a credential and never touches a live account.
  APP_ENV: test
  DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/aisep
  REDIS_URL: redis://localhost:6379/0

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # The same images docker-compose.yml uses. pgvector matters: the plain
      # postgres image has no vector extension, and the migration that creates
      # it would fail.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: aisep
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d aisep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # A broker, so the kafka tier is actually run rather than merely written.
      # The same lesson as the missing dependency: tests CI never runs are tests
      # CI does not cover. KRaft, single node, matching docker-compose.yml.
      kafka:
        image: apache/kafka:3.9.0
        ports: ["9092:9092"]
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
          KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
          KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          CLUSTER_ID: "aisep-ci-cluster-0001"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        # The kafka extra is included so the modules that import it are
        # typechecked. It is optional for a normal install, but code that CI
        # never typechecks is code CI does not actually cover -- which is how
        # a missing dependency reached main and failed here rather than
        # locally, where it had been pip-installed by hand.
        run: pip install -e ".[dev,kafka]"

      # Ordered cheapest-first, so an obvious failure is reported in seconds
      # rather than after the integration tier has run.
      - name: Lint
        run: ruff check .

      - name: Typecheck
        # Scope comes from pyproject.toml and covers app, eval and tests.
        run: mypy

      - name: Unit tests
        id: unit
        run: >-
          pytest -q -m "not integration and not sandbox and not llm and not kafka"
          --junitxml=unit-report.xml

      # A failed step otherwise reports only "Process completed with exit code
      # 1". Annotations are public run metadata, so the failing test names are
      # readable from the summary and the API without a token -- which matters
      # when the log is the only copy and reading it needs credentials.
      - name: Report which tests failed
        # Scoped to this step rather than to the job. A blanket failure()
        # fires after *any* earlier failure, so a typecheck error produced
        # "No JUnit report was written" annotations that pointed at tests
        # which had never run -- worse than no annotation at all.
        if: failure() && steps.unit.conclusion == 'failure'
        run: python scripts/annotate_failures.py unit-report.xml

      - name: Migrate
        run: alembic upgrade head

      # The reason this step exists: it fails when the models and the
      # migrations disagree, which is a drift that unit tests cannot see and
      # that only surfaces in production as a missing column.
      - name: Check migrations match the models
        run: alembic check

      - name: Integration tests
        id: integration
        # "and not llm" is load-bearing. A test carrying both markers -- its
        # file marks integration, the test itself marks llm -- is selected by
        # a bare "-m integration", so the model tier would leak into a job that
        # has no model.
        run: >-
          pytest -q -m "integration and not llm and not kafka"
          --junitxml=integration-report.xml

      # A failed step otherwise reports only "Process completed with exit code
      # 1". Annotations are public run metadata, so the failing test names are
      # readable from the summary and the API without a token -- which matters
      # when the log is the only copy and reading it needs credentials.
      - name: Report which tests failed
        if: failure() && steps.integration.conclusion == 'failure'
        run: python scripts/annotate_failures.py integration-report.xml

      - name: Kafka tests
        id: kafka
        run: pytest -q -m kafka --junitxml=kafka-report.xml

      - name: Report which tests failed
        if: failure() && steps.kafka.conclusion == 'failure'
        run: python scripts/annotate_failures.py kafka-report.xml

  sandbox:
    name: Sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        # The kafka extra is included so the modules that import it are
        # typechecked. It is optional for a normal install, but code that CI
        # never typechecks is code CI does not actually cover -- which is how
        # a missing dependency reached main and failed here rather than
        # locally, where it had been pip-installed by hand.
        run: pip install -e ".[dev,kafka]"

      # ADR-006 makes the sandbox a security boundary, so its tests assert
      # things like "the network is unreachable" and "the host filesystem is
      # not visible". Those are exactly the assertions worth running on every
      # change, and they need the real image: the base has no pytest, and
      # --network none means it could never be installed at run time.
      - name: Build the sandbox image
        # From the repository root, where the Dockerfile lives -- the same
        # command app/sandbox/runner.py names when the image is missing.
        working-directory: .
        run: docker build -f docker/sandbox.Dockerfile -t aisep-sandbox:latest .

      - name: Sandbox tests
        id: sandbox
        run: pytest -q -m sandbox --junitxml=sandbox-report.xml

      # A failed step otherwise reports only "Process completed with exit code
      # 1". Annotations are public run metadata, so the failing test names are
      # readable from the summary and the API without a token -- which matters
      # when the log is the only copy and reading it needs credentials.
      - name: Report which tests failed
        if: failure() && steps.sandbox.conclusion == 'failure'
        run: python scripts/annotate_failures.py sandbox-report.xml

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        # The build is the only step that exercises the server components and
        # the route tree as a whole.
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
