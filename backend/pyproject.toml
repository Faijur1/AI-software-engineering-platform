[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisep-backend"
version = "0.1.0"
description = "AI Software Engineering Platform — backend"
# Pinned to 3.11: tree-sitter grammars and the scientific stack used in later
# milestones do not have reliable prebuilt wheels on 3.14 for Windows.
requires-python = ">=3.11,<3.12"

# Dependencies are added milestone by milestone, only when something needs them.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "structlog>=24.4",
    "httpx>=0.27",          # GitHub API client (milestone 2)
    "pyjwt>=2.10",          # session cookie signing (milestone 2)
    "cryptography>=44.0",   # GitHub token encryption at rest (milestone 2)
    "pgvector>=0.3",                   # vector column + HNSW index (milestone 4)
    "rq>=1.16",                        # background job queue, ADR-003 (milestone 3)
    "tree-sitter>=0.23",               # AST-aware chunking, ADR-002 (milestone 3)
    "tree-sitter-language-pack>=0.7",  # prebuilt grammars, one wheel per platform
]

[project.optional-dependencies]
# Kafka is an optional extra rather than a core dependency: it is demo-only
# (ADR-004, ADR-005) and a default install should not pull a native driver for
# a broker most checkouts never start. Every import of it is lazy, inside the
# function that needs it, so the rest of the system runs without it.
kafka = ["confluent-kafka>=2.5"]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Alembic version scripts are machine-generated; reformatting them by hand adds
# churn without value. Real lint rules still apply — only layout is exempt.
"migrations/versions/*.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
# Tests are checked too. They had been left out, and drifted: two helpers were
# returning Any from annotated signatures. Test code asserts what the system
# promises, so an unchecked assertion is a weaker guarantee than it appears.
files = ["app", "eval", "tests"]
# Third-party packages without bundled type stubs.
[[tool.mypy.overrides]]
module = ["redis.*", "rq.*", "tree_sitter_language_pack.*"]
ignore_missing_imports = true

# confluent-kafka ships type information but does not re-export the admin
# types from their package. strict mode forbids relying on implicit re-export,
# so it is relaxed for this package only rather than importing from a private
# submodule that could move.
[[tool.mypy.overrides]]
module = ["confluent_kafka.*"]
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need Postgres and Redis running (docker compose up -d).
markers = [
    "integration: requires live Postgres and Redis",
    "llm: requires a running Ollama with the configured embedding model pulled",
    "sandbox: requires a running Docker daemon and the python:3.11-slim image",
    "kafka: requires a running Kafka broker (docker compose --profile kafka up -d)",
]
