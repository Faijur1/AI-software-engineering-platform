# Local development infrastructure only.
# The application itself (backend, workers, frontend) runs on the host during
# Stage 1 development for fast iteration. Only stateful dependencies live here.
services:
  postgres:
    # pgvector ships the extension prebuilt; ADR-001 keeps vectors in Postgres.
    image: pgvector/pgvector:pg16
    container_name: aisep-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: aisep
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d aisep"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aisep-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka is NOT started by default. It carries indexing events (ADR-004) and
  # the machine cannot afford to run it alongside everything else all day: see
  # ADR-005 for the measured numbers. Start it deliberately:
  #
  #     docker compose --profile kafka up -d
  #
  # KRaft mode, so there is no ZooKeeper. A single broker with one replica is
  # correct for a development machine and wrong for anything else, which is why
  # the replication factors below are pinned to 1 explicitly rather than left
  # at a default that would silently mean "no redundancy" in production.
  kafka:
    image: apache/kafka:3.9.0
    container_name: aisep-kafka
    profiles: ["kafka"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Small heap on purpose. The default sizes assume a server, and this
      # shares 3.7 GB with Postgres, Redis and everything else.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      CLUSTER_ID: "aisep-local-cluster-0001"
      # Point the broker at the mounted volume. Without this it writes to
      # /tmp/kafka-logs inside the container and the volume below is
      # decorative: the log survives a restart but not a recreate, which
      # quietly contradicts the durability the whole design rests on.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  kafka_data:
